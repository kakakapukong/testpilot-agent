<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TestPilot</title>
  <style>
    :root {
      --bg: #0b0c0e;
      --panel: #12141a;
      --row: #171a21;
      --border: #262a33;
      --text: #e8eaef;
      --muted: #8b93a7;
      --accent: #7ee0a3;
      --accent-2: #7aa2f7;
      --danger: #f7768e;
      --user: #1c2433;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
    }
    body {
      font: 14px/1.5 ui-sans-serif, "Segoe UI", system-ui, sans-serif;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto auto;
      height: 100dvh;
    }
    header, .composer {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      gap: 12px;
    }
    .brand { font-weight: 700; letter-spacing: 0.12em; font-size: 12px; }
    .meta { color: var(--muted); font-size: 13px; }
    #okdot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--danger); display: inline-block; margin-right: 8px;
    }
    #okdot.on { background: var(--accent); }
    main {
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #log {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 16px 20px 20px;
    }
    .user-msg, .final, .live {
      background: var(--row);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin: 0 0 8px;
    }
    .user-msg { background: var(--user); border-color: #2a3550; }
    .final.ok { border-color: #244833; }
    .final.err { border-color: #4a2430; }
    .live { border-color: #3d4a2a; }
    .step {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--row);
      margin: 0 0 6px;
    }
    .step summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      gap: 10px;
      align-items: center;
      min-height: 40px;
      padding: 6px 12px;
      color: var(--muted);
    }
    .step summary::-webkit-details-marker { display: none; }
    .step summary::before {
      content: "";
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted);
      flex: none;
    }
    .step[open] summary { color: var(--text); }
    .step[open] summary::before { background: var(--accent-2); }
    .step.done summary::before { background: var(--accent); }
    .step.fail summary::before { background: var(--danger); }
    .step-body {
      padding: 0 12px 10px 28px;
      color: var(--muted);
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .grow { flex: 1; }
    .dur {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .empty { color: var(--muted); max-width: 36em; margin: 12vh auto; text-align: center; line-height: 1.7; }
    .approval {
      display: none;
      margin: 0 20px 12px;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #35532c;
      background: #142018;
    }
    .approval.show { display: block; }
    .approval pre { margin: 8px 0 12px; font-family: ui-monospace, Consolas, monospace; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    button, input, textarea {
      font: inherit; color: var(--text);
      background: #0e1014; border: 1px solid var(--border); border-radius: 8px;
    }
    button { min-height: 40px; padding: 0 14px; cursor: pointer; }
    button:hover { border-color: #4a5160; }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent-2); outline-offset: 2px;
    }
    button.primary { background: var(--accent); color: #10200c; border-color: var(--accent); font-weight: 700; }
    button.danger { color: var(--danger); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .composer {
      border-top: 1px solid var(--border);
      border-bottom: none;
      padding: 12px 18px 14px;
      display: grid;
      gap: 8px;
      flex-shrink: 0;
    }
    .composer-line { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
    label { display: grid; gap: 4px; color: var(--muted); font-size: 12px; }
    input, textarea { min-height: 40px; padding: 8px 10px; width: 100%; }
    textarea { min-height: 64px; resize: vertical; }
    #statusbar {
      padding: 7px 18px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
    }
    @media (max-width: 800px) { .composer-line { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">TESTPILOT</div>
    <div class="meta"><span id="okdot"></span><span id="cred">正在读取本地凭据…</span></div>
  </header>
  <main>
    <div class="approval" id="approval">
      <div>需要你批准这次修改</div>
      <div class="step-body" style="padding-left:0">pytest 与 Reviewer 已通过。批准会留下改动，拒绝会恢复运行前的文件。</div>
      <pre id="approval-body"></pre>
      <div class="row">
        <button class="primary" id="approve" type="button">批准</button>
        <button class="danger" id="reject" type="button">拒绝并回滚</button>
      </div>
    </div>
    <div id="log">
      <div class="empty" id="empty">选择工作目录，输入要修复的任务，然后运行。完成后步骤会自动折起，需要时再点开。</div>
    </div>
  </main>
  <form class="composer" id="form">
    <label>工作目录
      <input id="workspace" list="workspaces" required autocomplete="off" placeholder="选择或输入项目路径">
      <datalist id="workspaces"></datalist>
    </label>
    <div class="composer-line">
      <label>任务
        <textarea id="task" required placeholder="例如：修复失败的 subtract 测试，不要修改 tests"></textarea>
      </label>
      <button class="primary" id="run" type="submit">运行</button>
    </div>
  </form>
  <div id="statusbar">STATUS=-</div>
  <script>
    const log = document.getElementById("log");
    const empty = document.getElementById("empty");
    const form = document.getElementById("form");
    const runBtn = document.getElementById("run");
    const approval = document.getElementById("approval");
    const approvalBody = document.getElementById("approval-body");
    const statusbar = document.getElementById("statusbar");
    let stream = null;
    let live = null;

    function fmt(ms) {
      if (typeof ms !== "number") return "";
      return ms < 1000 ? ms + " ms" : (ms / 1000).toFixed(1) + "s";
    }

    function clearEmpty() { if (empty) empty.remove(); }

    function addBlock(cls, title, detail) {
      clearEmpty();
      const node = document.createElement("div");
      node.className = cls;
      node.innerHTML = "<div>" + title + "</div>";
      if (detail) {
        const p = document.createElement("div");
        p.className = "step-body";
        p.style.padding = "6px 0 0";
        p.textContent = detail;
        node.appendChild(p);
      }
      log.appendChild(node);
      log.scrollTop = log.scrollHeight;
      return node;
    }

    function collapseLive() {
      if (!live) return;
      live.open = false;
      live.classList.add("done");
      live.classList.remove("live");
      live = null;
    }

    function openStep(title, detail) {
      collapseLive();
      clearEmpty();
      const wrap = document.createElement("details");
      wrap.className = "step live";
      wrap.open = true;
      const summary = document.createElement("summary");
      const label = document.createElement("span");
      label.className = "grow";
      label.textContent = title;
      const dur = document.createElement("span");
      dur.className = "dur";
      summary.append(label, dur);
      const body = document.createElement("div");
      body.className = "step-body";
      body.textContent = detail || "";
      wrap.append(summary, body);
      log.appendChild(wrap);
      log.scrollTop = log.scrollHeight;
      live = wrap;
      live._label = label;
      live._dur = dur;
      live._body = body;
    }

    function finishStep(title, detail, duration, ok) {
      const target = live || document.querySelector(".step.live");
      if (!target) {
        openStep(title, detail);
      }
      const node = live;
      node._label.textContent = title;
      if (detail) node._body.textContent = detail;
      if (duration != null) node._dur.textContent = fmt(duration);
      node.classList.toggle("fail", ok === false);
      node.open = false;
      node.classList.add("done");
      node.classList.remove("live");
      live = null;
    }

    function setStatus(payload) {
      const keys = ["STATUS", "stop_reason", "review", "approval", "run_id", "memory_saved"];
      statusbar.textContent = keys
        .filter((key) => payload[key] != null)
        .map((key) => key + "=" + payload[key])
        .join("   ") || "STATUS=-";
    }

    function listen() {
      if (stream) stream.close();
      stream = new EventSource("/api/runs/current/events");
      stream.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === "tool" && data.stage === "start") {
          openStep(data.title, data.detail);
          return;
        }
        if (data.type === "tool" && data.stage === "complete") {
          finishStep(data.title, data.detail, data.duration_ms, data.ok);
          return;
        }
        if (data.type === "phase" && data.stage === "start") {
          openStep(data.title, data.detail);
          return;
        }
        if (data.type === "phase") {
          finishStep(data.title, data.detail, data.duration_ms, data.ok);
          return;
        }
        if (data.type === "note") {
          collapseLive();
          addBlock("user-msg", data.title, data.detail);
          return;
        }
        if (data.type === "approval_required") {
          collapseLive();
          approval.classList.add("show");
          approvalBody.textContent = (data.lines || []).join("\n");
          addBlock("final", data.title, data.detail);
          return;
        }
        if (data.type === "status") {
          collapseLive();
          setStatus(data);
          addBlock("final " + (data.STATUS === "SUCCESS" ? "ok" : "err"), data.title, data.detail);
          approval.classList.remove("show");
          runBtn.disabled = false;
          return;
        }
        if (data.type === "error") {
          collapseLive();
          addBlock("final err", data.title || "运行失败", data.detail || data.message);
          runBtn.disabled = false;
        }
      };
      stream.addEventListener("end", () => { stream.close(); runBtn.disabled = false; });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const payload = {
        workspace: document.getElementById("workspace").value.trim(),
        task: document.getElementById("task").value,
      };
      if (!payload.workspace || !payload.task) return;
      runBtn.disabled = true;
      addBlock("user-msg", "任务", payload.task);
      listen();
      const response = await fetch("/api/runs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const body = await response.json();
      if (!response.ok) {
        addBlock("final err", "无法开始", body.error || "could not start run");
        runBtn.disabled = false;
      }
    });

    async function decide(decision) {
      const response = await fetch("/api/runs/current/approval", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ decision }),
      });
      const body = await response.json();
      approval.classList.remove("show");
      if (body.STATUS) setStatus(body);
      runBtn.disabled = false;
    }
    document.getElementById("approve").onclick = () => decide("approved");
    document.getElementById("reject").onclick = () => decide("rejected");

    fetch("/api/bootstrap").then((r) => r.json()).then((data) => {
      const dot = document.getElementById("okdot");
      const cred = document.getElementById("cred");
      if (data.credentials_ready) {
        dot.classList.add("on");
        cred.textContent = (data.model || "model") + " · 凭据已加载";
      } else {
        cred.textContent = "未找到 API 设置，请写入 " + data.credential_file;
      }
      const list = document.getElementById("workspaces");
      const recents = data.recent_workspaces || [];
      list.innerHTML = recents.map((p) => "<option value=\"" + p.replace(/"/g, "&quot;") + "\">").join("");
      if (recents[0]) document.getElementById("workspace").value = recents[0];
      if (data.default_task) document.getElementById("task").value = data.default_task;
    }).catch(() => {
      document.getElementById("cred").textContent = "无法读取本地配置";
    });
  </script>
</body>
</html>
