[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testpilot-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["openai>=2,<3"]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
testpilot = "testpilot.cli:main"
testpilot-demo = "testpilot.demo:main"
testpilot-web = "testpilot.web:main"

[tool.setuptools.package-data]
testpilot = ["static/console.html"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
